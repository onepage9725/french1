<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - WhatsApp Numbers Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="image/RecruteMaroc.png" type="image/png">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900">

    <div class="min-h-screen p-6 md:p-12">
        <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-[#08265c] to-[#3f8a3e] p-8 text-white flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-black mb-2">Administration Panel</h1>
                    <p class="text-white/80">Manage WhatsApp numbers for the floating button</p>
                </div>
                <a href="index.html" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg font-bold transition-colors">
                    Back to site
                </a>
            </div>

            <!-- Content -->
            <div class="p-8">
                <!-- Add New Number -->
                <div class="mb-10 bg-gray-50 p-6 rounded-2xl border border-gray-200">
                    <h2 class="text-xl font-bold mb-4 text-[#08265c]">Add a number</h2>
                    <form id="addForm" class="flex flex-col md:flex-row gap-4">
                        <input type="text" id="waName" placeholder="Contact name (optional)" class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:border-[#3f8a3e] focus:ring-2 focus:ring-[#3f8a3e]/20 outline-none">
                        <input type="tel" id="waNumber" placeholder="Number (e.g., 212600000000)" required class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:border-[#3f8a3e] focus:ring-2 focus:ring-[#3f8a3e]/20 outline-none">
                        <button type="submit" class="bg-[#3f8a3e] hover:bg-[#2e682d] text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-md">
                            Add
                        </button>
                    </form>
                </div>

                <!-- Numbers List -->
                <div class="mb-10">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-[#08265c]">Numbers List (<span id="count">0</span>/20)</h2>
                        <button id="testRandomBtn" class="bg-[#08265c] hover:bg-[#103b87] text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors shadow-md flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M6.5 5a2.25 2.25 0 100 4.5 2.25 2.25 0 000-4.5zM3 7.25a3.75 3.75 0 117.5 0 3.75 3.75 0 01-7.5 0zM13.5 5a2.25 2.25 0 100 4.5 2.25 2.25 0 000-4.5zM10 7.25a3.75 3.75 0 117.5 0 3.75 3.75 0 01-7.5 0z" clip-rule="evenodd" />
                            </svg>
                            Test random number
                        </button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b-2 border-gray-200 text-gray-500 text-sm uppercase tracking-wider">
                                    <th class="py-3 px-4">Name</th>
                                    <th class="py-3 px-4">WhatsApp Number</th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="numbersTableBody" class="text-gray-700">
                                <!-- Dynamic Content -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div id="emptyState" class="hidden text-center py-10 text-gray-500">
                        No WhatsApp numbers configured. Add one above!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6">
            <h3 class="text-xl font-bold mb-4 text-[#08265c]">Edit Number</h3>
            <input type="hidden" id="editId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Name</label>
                    <input type="text" id="editName" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-[#3f8a3e] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Numéro WhatsApp</label>
                    <input type="tel" id="editNumber" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:border-[#3f8a3e] outline-none" required>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="editActive" class="w-4 h-4 text-[#3f8a3e] rounded">
                    <label for="editActive" class="text-sm font-medium">Active (Included in random rotation)</label>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button id="cancelEdit" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-semibold transition-colors">Cancel</button>
                    <button id="saveEdit" class="bg-[#3f8a3e] text-white px-4 py-2 rounded-lg font-bold hover:bg-[#2e682d] transition-colors">Save</button>
                </div>
            </div>
        </div>
    </div>

        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // TODO: Replace with your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBOUgDahaiZfrNb1iHqZDhinVmDxcYhg_s",
            authDomain: "french-4726a.firebaseapp.com",
            projectId: "french-4726a",
            storageBucket: "french-4726a.firebasestorage.app",
            messagingSenderId: "580878028564",
            appId: "1:580878028564:web:dec45239d48982242ebc01",
            measurementId: "G-1GWRJDCL80"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);
        const numbersCol = collection(db, "whatsapp_numbers");

        let waNumbers = [];
        
        const tableBody = document.getElementById('numbersTableBody');
        const emptyState = document.getElementById('emptyState');
        const countEl = document.getElementById('count');
        const addForm = document.getElementById('addForm');
        
        const editModal = document.getElementById('editModal');
        const editIdInput = document.getElementById('editId');
        const editNameInput = document.getElementById('editName');
        const editNumberInput = document.getElementById('editNumber');
        const editActiveInput = document.getElementById('editActive');
        const saveEditBtn = document.getElementById('saveEdit');
        const cancelEditBtn = document.getElementById('cancelEdit');
        const testBtn = document.getElementById('testRandomBtn');

        // Real-time listener for Firestore
        onSnapshot(numbersCol, (snapshot) => {
            waNumbers = [];
            snapshot.forEach((docSnap) => {
                waNumbers.push({
                    id: docSnap.id,
                    ...docSnap.data()
                });
            });
            renderTable();
        });

        function renderTable() {
            tableBody.innerHTML = '';
            countEl.innerText = waNumbers.length;
            
            if (waNumbers.length === 0) {
                emptyState.classList.remove('hidden');
                tableBody.parentElement.classList.add('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tableBody.parentElement.classList.remove('hidden');

            waNumbers.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-50 hover:bg-gray-50 transition-colors";
                
                const activeBadge = item.active !== false 
                    ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">Active</span>`
                    : `<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded-full text-xs font-bold">Inactive</span>`;

                tr.innerHTML = `
                    <td class="py-4 px-4 font-semibold text-gray-900">${item.name || 'No Name'}</td>
                    <td class="py-4 px-4 text-[#3f8a3e] font-mono tracking-wider">${item.number}</td>
                    <td class="py-4 px-4">${activeBadge}</td>
                    <td class="py-4 px-4 text-right flex justify-end gap-2">
                        <button class="edit-btn text-blue-500 hover:text-blue-700 p-2 bg-blue-50 rounded-lg transition-colors" title="Edit" data-id="${item.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </button>
                        <button class="delete-btn text-red-500 hover:text-red-700 p-2 bg-red-50 rounded-lg transition-colors" title="Delete" data-id="${item.id}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    editNumber(e.currentTarget.getAttribute('data-id'));
                });
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    deleteNumber(e.currentTarget.getAttribute('data-id'));
                });
            });
        }

        // Add
        addForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (waNumbers.length >= 20) {
                alert("You have reached the limit of 20 numbers.");
                return;
            }
            
            const name = document.getElementById('waName').value.trim();
            const number = document.getElementById('waNumber').value.trim().replace(/\D/g, ''); 
            
            if (number.length < 5) {
                alert("Please enter a valid number with country code (e.g: 212600000000)");
                return;
            }
            
            try {
                await addDoc(numbersCol, { name, number, active: true });
                document.getElementById('waName').value = '';
                document.getElementById('waNumber').value = '';
            } catch (err) {
                console.error("Error adding doc:", err);
                alert("Failed to add number. Check console.");
            }
        });

        // Edit
        function editNumber(id) {
            const item = waNumbers.find(n => n.id === id);
            if (!item) return;
            
            editIdInput.value = id;
            editNameInput.value = item.name;
            editNumberInput.value = item.number;
            editActiveInput.checked = item.active !== false;
            editModal.classList.remove('hidden');
        }

        saveEditBtn.addEventListener('click', async () => {
            const id = editIdInput.value;
            const itemRef = doc(db, "whatsapp_numbers", id);
            try {
                await updateDoc(itemRef, {
                    name: editNameInput.value.trim(),
                    number: editNumberInput.value.trim().replace(/\D/g, ''),
                    active: editActiveInput.checked
                });
                editModal.classList.add('hidden');
            } catch (err) {
                console.error("Error updating doc:", err);
                alert("Failed to update.");
            }
        });

        cancelEditBtn.addEventListener('click', () => {
            editModal.classList.add('hidden');
        });

        // Delete
        function deleteNumber(id) {
            if (confirm("Are you sure you want to delete this number?")) {
                const itemRef = doc(db, "whatsapp_numbers", id);
                deleteDoc(itemRef).catch(err => {
                    console.error("Error deleting doc:", err);
                    alert("Failed to delete.");
                });
            }
        }

        // Test
        testBtn.addEventListener('click', () => {
            const activeNumbers = waNumbers.filter(n => n.active !== false);
            if (activeNumbers.length === 0) {
                alert("No active numbers to choose from!");
                return;
            }
            const randomItem = activeNumbers[Math.floor(Math.random() * activeNumbers.length)];
            alert(`Simulation: System picked -> ${randomItem.name} (${randomItem.number})\n\nRedirecting to WhatsApp...`);
            window.open('https://wa.me/' + randomItem.number, '_blank');
        });
    </script>
</body>
</html>
